# netlify.toml — routing (and, later, headers) for kpt-seasonals.netlify.app.
# The site is static and published from the repo root; build settings stay in the
# Netlify UI. Preview these rules locally with: node scripts/serve_local.js
#
# Every page is a root-level .html file served at a clean route by a 200 rewrite,
# so the URL stays clean and relative asset paths keep resolving from the root.
# Netlify ignores trailing slashes when matching, so /dashboard/ is covered too.

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# Internal folders must never be served: build specs/mockups and maintenance
# scripts live in the published root. Forced so real files under them 404 too.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Legal & trust pages (v1.19)
[[redirects]]
  from = "/risk"
  to = "/risk.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/sources"
  to = "/sources.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Content pages (v1.22+)
[[redirects]]
  from = "/methodology"
  to = "/methodology.html"
  status = 200

[[redirects]]
  from = "/this-week"
  to = "/this-week.html"
  status = 200

[[redirects]]
  from = "/heatmap"
  to = "/heatmap.html"
  status = 200

# ── Security headers (v1.21) ──────────────────────────────────────────────────
# CSP (enforcing — validated report-only first): scripts only from this site + cdnjs (Chart.js, marked) + TradingView's widget
# loader; no inline script anywhere (see scripts/patch_csp_inline.js). Frames only for
# the two click-to-load embeds. connect-src = this site + the AI providers called
# directly from the browser + a local Ollama server.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src https://*.tradingview.com https://*.tradingview-widget.com https://*.investing.com; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com http://localhost:11434 http://127.0.0.1:11434; base-uri 'self'; form-action 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
